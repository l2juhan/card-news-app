<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1024px; height: 1024px; overflow: hidden; }
    .icon {
      width: 1024px;
      height: 1024px;
      background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 220px;
      position: relative;
    }
    .cards {
      position: relative;
      width: 600px;
      height: 600px;
    }
    .card {
      position: absolute;
      width: 380px;
      height: 480px;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .card.back {
      top: 60px;
      left: 0;
      transform: rotate(-8deg);
      background: rgba(255,255,255,0.85);
    }
    .card.middle {
      top: 30px;
      left: 110px;
      transform: rotate(0deg);
      background: rgba(255,255,255,0.95);
    }
    .card.front {
      top: 0;
      left: 220px;
      transform: rotate(8deg);
      background: white;
      display: flex;
      flex-direction: column;
      padding: 60px 50px;
      gap: 28px;
    }
    .card.front .accent {
      width: 90px;
      height: 14px;
      background: #6C5CE7;
      border-radius: 7px;
    }
    .card.front .title {
      width: 100%;
      height: 38px;
      background: #2D3436;
      border-radius: 19px;
    }
    .card.front .line {
      width: 100%;
      height: 18px;
      background: #DFE6E9;
      border-radius: 9px;
    }
    .card.front .line.short { width: 70%; }
  </style>
</head>
<body>
  <div class="icon">
    <div class="cards">
      <div class="card back"></div>
      <div class="card middle"></div>
      <div class="card front">
        <div class="accent"></div>
        <div class="title"></div>
        <div class="line"></div>
        <div class="line short"></div>
      </div>
    </div>
  </div>
</body>
</html>
